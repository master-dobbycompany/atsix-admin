<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>여섯시 운영 콘솔</title>
<style>
/* 폰에서 한 손으로 쓰는 것이 목적이다. 밤에 신고가 오면 PC 앞에 없다. */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
       background:#FAF8F5; color:#1F1B16; line-height:1.6; font-size:16px; padding-bottom:40px; }
.wrap { max-width:720px; margin:0 auto; padding:16px; }
h1 { font-size:20px; font-weight:800; margin-bottom:12px; }
.card { background:#fff; border:1px solid #E5DFD8; border-radius:16px; padding:16px; margin-bottom:12px; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
input, button, select, textarea { font:inherit; }
input, textarea { width:100%; padding:12px; border:1px solid #E5DFD8; border-radius:12px; background:#fff; }
textarea { min-height:70px; resize:vertical; }
button { padding:12px 14px; border:0; border-radius:12px; background:#F2543D; color:#fff; font-weight:700; cursor:pointer; }
button.ghost { background:#fff; color:#1F1B16; border:1px solid #E5DFD8; }
button.warn { background:#C0392B; }
button:disabled { opacity:.5; }
.muted { color:#8A8178; font-size:13px; }
.pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700;
        background:#F3EEE8; color:#8A8178; }
.pill.hot { background:#FBE9E9; color:#C0392B; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; }
.stats div b { display:block; font-size:22px; }
.msg { background:#F3EEE8; border-radius:10px; padding:10px; margin:8px 0; font-size:14px; white-space:pre-wrap; }
.ctx { font-size:13px; margin-top:10px; }
.ctxList { max-height:320px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.ctxList p { padding:8px 0; border-bottom:1px solid #F3EEE8; word-break:break-word; }
.ctxList p b { display:block; font-size:12px; color:#8A8178; margin-bottom:2px; }
.ctxList p.fromTarget b { color:#C0392B; }
.ctxList p.hit { background:#FBE9E9; margin:0 -8px; padding:8px; border-radius:8px; }
.hidden { display:none; }
.tabs { display:flex; gap:6px; margin-bottom:12px; }
.tabs button { flex:1; background:#fff; color:#8A8178; border:1px solid #E5DFD8; }
.tabs button.on { background:#1F1B16; color:#fff; border-color:#1F1B16; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { border-bottom:1px solid #F3EEE8; padding:6px 4px; text-align:left; }
th { color:#8A8178; font-weight:700; }
td.num, th.num { text-align:right; }
h2 { font-size:15px; font-weight:800; margin:14px 0 6px; }
.mem { display:inline-block; background:#F3EEE8; border-radius:999px; padding:2px 8px;
       margin:2px 3px 0 0; font-size:12px; }
.mem.f { background:#FBE9E9; } .mem.m { background:#E8F0FB; }
.mem.out { opacity:.45; text-decoration:line-through; }
#toast { position:fixed; left:16px; right:16px; bottom:16px; background:#1F1B16; color:#fff;
         padding:14px; border-radius:12px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>여섯시 운영 콘솔</h1>

  <!-- 로그인 -->
  <div id="login" class="card">
    <p class="muted" style="margin-bottom:10px">관리자 계정으로 로그인하세요.</p>
    <input id="email" type="email" placeholder="이메일" autocomplete="username">
    <div style="height:8px"></div>
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div style="height:10px"></div>
    <button id="loginBtn" style="width:100%">로그인</button>
    <p id="loginErr" class="muted" style="color:#C0392B; margin-top:8px"></p>
  </div>

  <!-- 대시보드 -->
  <div id="app" class="hidden">
    <div class="card">
      <div class="stats">
        <div><b id="sReports">-</b><span class="muted">미처리 신고</span></div>
        <div><b id="sQueue">-</b><span class="muted">대기 (여/남)</span></div>
        <div><b id="sRooms">-</b><span class="muted">활성 방</span></div>
        <div><b id="sLongWait">-</b><span class="muted">24시간+ 대기</span></div>
      </div>
      <div style="height:10px"></div>
      <div class="row">
        <button class="ghost" id="refresh" style="flex:1">새로고침</button>
        <button class="ghost" id="logout">로그아웃</button>
      </div>
    </div>

    <div class="tabs">
      <button id="tabReports" class="on">신고</button>
      <button id="tabRooms">방</button>
      <button id="tabStats">통계</button>
      <button id="tabRegions">지역</button>
      <button id="tabPlaces">장소</button>
      <button id="tabConfig">설정</button>
    </div>

    <div id="reports"></div>
    <div id="rooms" class="hidden"></div>
    <div id="stats" class="hidden"></div>
    <div id="regions" class="hidden"></div>
    <div id="places" class="hidden"></div>
    <div id="config" class="hidden"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// anon 키는 공개용이다. 실제 권한은 서버의 is_admin() 검사와 RLS 가 결정한다.
const sb = createClient(
  'https://snszyugzoxektvcyydya.supabase.co',
  'sb_publishable_3a09zQjtuhXN8CV0g7NnaQ_kGTtqlNC'
);

const $ = (id) => document.getElementById(id);
// 앱 AppState.reportReasons · 서버 reports_self · 커뮤니티 가이드와 같아야 한다.
const REASONS = {
  sexual: '성적인 메시지',
  minor_safety: '미성년자·아동 안전',
  harassment: '욕설·비하·괴롭힘',
  impersonation: '사칭·프로필 거짓 기재',
  spam: '광고·홍보·외부 유도',
  noshow_fraud: '미팅 관련 문제 행동',
  other: '기타',
  profile_photo: '프로필 사진에 문제가 있음',
};
const ACTIONS = [
  ['reviewed_no_action', '문제 없음', 'ghost'],
  ['warned', '경고', ''],
  ['removed_from_room', '방에서 제외', ''],
  ['suspended', '이용 정지', 'warn'],
];

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2800);
}

// 로그인 실패는 한 문구로만 말한다. 비밀번호가 틀렸을 때와 맞았지만 관리자가
// 아닐 때를 가르면, 이 화면이 비밀번호 확인기가 된다.
const LOGIN_FAIL = '이메일 또는 비밀번호가 맞지 않아요';

function isNetworkError(e) {
  const m = String(e?.message ?? e ?? '').toLowerCase();
  return m.includes('fetch') || m.includes('network') || m.includes('failed to fetch');
}

async function login() {
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  try {
    const { error } = await sb.auth.signInWithPassword({
      email: $('email').value.trim(), password: $('password').value,
    });
    if (error) {
      $('loginErr').textContent = isNetworkError(error)
        ? '인터넷 연결을 확인하고 다시 시도해주세요'
        : LOGIN_FAIL;
      return;
    }
    await start({ fromLogin: true });
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function start({ fromLogin = false } = {}) {
  // 관리자가 아니면 서버가 예외를 던진다 — 화면을 열어두지 않는다.
  // 실패 사유는 로그인 실패와 같게 둔다. 관리자 아님을 알리면 비밀번호가 맞았다는 뜻이다.
  const { data, error } = await sb.rpc('admin_dashboard');
  if (error) {
    await sb.auth.signOut();
    if (fromLogin) {
      $('loginErr').textContent = isNetworkError(error)
        ? '인터넷 연결을 확인하고 다시 시도해주세요'
        : LOGIN_FAIL;
    }
    return;
  }
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  render(data);
  await loadReports();
}

function render(d) {
  $('sReports').textContent = d.open_reports ?? 0;
  $('sQueue').textContent = `${d.queue_female ?? 0}/${d.queue_male ?? 0}`;
  $('sRooms').textContent = d.active_rooms ?? 0;
  sb.rpc('admin_wait_stats').then(({ data }) => {
    $('sLongWait').textContent = data?.waiting?.over_24h ?? '-';
  });
}

async function loadReports() {
  const box = $('reports');
  box.innerHTML = '<div class="card muted">불러오는 중…</div>';
  const { data, error } = await sb.rpc('admin_open_reports');
  if (error) { box.innerHTML = `<div class="card">오류: ${error.message}</div>`; return; }
  if (!data.length) {
    box.innerHTML = '<div class="card">미처리 신고가 없어요. 👍</div>';
    return;
  }
  box.innerHTML = '';
  for (const r of data) box.appendChild(card(r));
}

function card(r) {
  const el = document.createElement('div');
  el.className = 'card';
  const hot = r.hours_open >= 24;
  el.innerHTML = `
    <div class="row" style="justify-content:space-between; align-items:center">
      <span class="pill ${hot ? 'hot' : ''}">${r.hours_open}시간 경과</span>
      <span class="muted">${new Date(r.created_at).toLocaleString('ko-KR')}</span>
    </div>
    <p style="margin-top:8px"><b>${escapeHtml(r.reported ?? '(탈퇴)')}</b> 님을
       <b>${escapeHtml(REASONS[r.reason_code] ?? r.reason_code)}</b> 로 신고
       <span class="muted">(신고자 ${escapeHtml(r.reporter ?? '(탈퇴)')})</span></p>
    ${r.message_body ? `<div class="msg">${escapeHtml(r.message_body)}</div>` : ''}
    ${r.reason ? `<p class="muted">사유 상세: ${escapeHtml(r.reason)}</p>` : ''}
    <div class="row" style="margin-top:8px">
      <button class="ghost ctxBtn" style="flex:1">대화 보기</button>
      <button class="ghost histBtn" style="flex:1">이 사람 이력</button>
    </div>
    <div class="ctx hidden"></div>
    <div style="height:10px"></div>
    <textarea placeholder="판단 근거 (분쟁 시 이게 핵심이에요)"></textarea>
    <div style="height:8px"></div>
    <div class="row">
      ${ACTIONS.map(([a, label, cls]) =>
        `<button class="${cls} act" data-a="${a}" style="flex:1 1 46%">${label}</button>`).join('')}
    </div>`;

  const ctx = el.querySelector('.ctx');
  el.querySelector('.ctxBtn').onclick = async () => {
    if (!r.room_id) return toast('방 정보가 없는 신고예요');
    ctx.classList.toggle('hidden');
    if (ctx.dataset.loaded) return;
    const { data } = await sb.rpc('admin_room_context', { p_room: r.room_id, p_limit: 200 });
    renderContext(ctx, data ?? [], r);
    ctx.dataset.loaded = '1';
  };
  el.querySelector('.histBtn').onclick = async () => {
    const { data } = await sb.rpc('admin_user_history', { p_user: r.reported_id });
    toast(!data?.length ? '이전 신고 없음'
      : `이전 신고 ${data.length}건 · 최근: ${REASONS[data[0].reason_code] ?? ''} (${data[0].action ?? '미처리'})`);
  };

  el.querySelectorAll('.act').forEach(btn => {
    btn.onclick = async () => {
      const note = el.querySelector('textarea').value.trim();
      if (!note) return toast('판단 근거를 적어주세요');
      if (!confirm(`"${btn.textContent}" 처리할까요?`)) return;
      el.querySelectorAll('button').forEach(b => b.disabled = true);
      const { data, error } = await sb.rpc('admin_act', {
        p_report: r.id, p_action: btn.dataset.a, p_note: note, p_block_days: 30,
      });
      if (error) { toast('실패: ' + error.message); el.querySelectorAll('button').forEach(b => b.disabled = false); return; }
      toast(data ?? '처리 완료');
      el.remove();
      const { data: d } = await sb.rpc('admin_dashboard');
      if (d) render(d);
    };
  });
  return el;
}

// ---- 방: 어떤 사람들이 어떻게 모였고 미팅은 어땠나 ----
async function loadRooms() {
  const box = $('rooms');
  box.innerHTML = '<div class="card muted">불러오는 중…</div>';
  const { data, error } = await sb.rpc('admin_rooms', { p_limit: 20 });
  if (error) { box.innerHTML = `<div class="card">오류: ${error.message}</div>`; return; }
  if (!data?.length) { box.innerHTML = '<div class="card">아직 방이 없어요.</div>'; return; }

  box.innerHTML = data.map(r => {
    const mem = (r.members ?? []).map(m => {
      // 완주는 이탈이 아니다. 방이 끝나서 나간 것이라 취소선을 긋지 않는다.
      const gone = m.left && m.left_reason !== 'completed';
      const cls = `mem ${m.gender === 'female' ? 'f' : 'm'}${gone ? ' out' : ''}`;
      const mark = m.has_photo ? '' : ' ·사진없음';
      const why = m.left_reason === 'expelled' ? ' (방출)'
                : m.left_reason === 'completed' ? ' (완주)'
                : m.left ? ' (나감)' : '';
      return `<span class="${cls}">${escapeHtml(m.nickname)} ${escapeHtml(m.age_band ?? '')}${mark}${why}</span>`;
    }).join('');

    const mt = r.meeting;
    const meeting = !mt
      ? '<p class="muted">미팅 아직 안 열림</p>'
      : `<p>미팅 <b>${mt.status}</b>
           ${mt.meets_at ? `· ${new Date(mt.meets_at).toLocaleString('ko-KR')}` : ''}
           ${mt.settled ? `· 참석 <b>${mt.attendees}</b>명 · 1:1 <b>${mt.dm_threads}</b>쌍
              ${mt.absence_notices ? `· 사전불참 ${mt.absence_notices}` : ''}`
             : '<span class="muted"> (판정 전)</span>'}</p>`;

    return `<div class="card">
      <div class="row" style="justify-content:space-between">
        <b>${escapeHtml(r.name)}</b>
        <span class="muted">${new Date(r.started_at).toLocaleDateString('ko-KR')} 개설</span>
      </div>
      <p class="muted">${r.elapsed_days}일차 · 미션 ${r.completed_days}/${r.required_days} 완료
         · 활성 ${r.active_members}명 · ${escapeHtml(r.status)}</p>
      <div style="margin:6px 0">${mem}</div>
      ${meeting}
    </div>`;
  }).join('');
}

// ---- 지역: 어디에 수요가 쌓였나 = 다음에 열 곳 ----
async function loadRegions() {
  const box = $('regions');
  box.innerHTML = '<div class="card muted">불러오는 중…</div>';
  const { data, error } = await sb.rpc('admin_region_demand');
  if (error) { box.innerHTML = `<div class="card">오류: ${error.message}</div>`; return; }

  const need = (data ?? [])[0]?.open_min_per_gender ?? 30;
  const rows = (data ?? []).map(r => {
    // 자동으로 열리는 조건: 여·남 각 need 명 이상 + 장소 카페 2 · 식당 2 (auto_open_regions, 10분마다)
    const why = r.active ? ''
      : (r.female < need || r.male < need) ? `여 ${Math.max(0, need - r.female)} · 남 ${Math.max(0, need - r.male)} 더`
      : !r.places_ready ? '<b>장소 부족</b>(카페 2 · 식당 2)'
      : '다음 배치에 열림';
    return `<tr>
      <td>${escapeHtml(r.region)}</td>
      <td>${r.active ? '<b>열림</b>' : '<span class="muted">준비 중</span>'}</td>
      <td class="num"><b>${r.waiting}</b></td>
      <td class="num">${r.female}</td>
      <td class="num">${r.male}</td>
      <td>${r.places_ready ? '2·2 ✓' : '<span class="muted">부족</span>'}</td>
      <td class="muted">${why}</td>
      <td><button class="ghost regionToggle" data-region="${escapeHtml(r.region)}" data-on="${r.active ? 0 : 1}"
          style="padding:6px 10px">${r.active ? '끄기' : '켜기'}</button></td>
    </tr>`;
  }).join('');

  box.innerHTML = `<div class="card">
    <h2 style="margin-top:0">지역별 대기 인원</h2>
    <p class="muted">준비 중인 지역은 <b>여 ${need} · 남 ${need} 명 이상</b>이 모이고 장소가
       <b>카페 2 · 식당 2</b> 이상이면 10분 안에 <b>자동으로 열린다</b>(어느 지역이든).
       재회가 영구 금지라 첫 방이 깨져도 새 조합을 짤 풀이 있어야 한다(2026-10-01).
       열리는 순간 그 지역 사람들이 줄을 서고 "지역이 열렸어요" 알림이 간다.</p>
    <table>
      <tr><th>지역</th><th>상태</th><th class="num">대기</th>
          <th class="num">여</th><th class="num">남</th><th>장소</th><th>열리려면</th><th></th></tr>
      ${rows || '<tr><td colspan="8" class="muted">아직 없어요</td></tr>'}
    </table>
    <p class="muted" style="margin-top:10px">
      대기 인원은 쉬는 중·방 있는 사람을 뺀 수다. 열기 기준은 여기에 프로필 미완성·(인증 필수일 때)
      미인증도 뺀다 — 그래서 표의 숫자가 기준을 넘어도 조금 늦게 열릴 수 있다.
      기준 바꾸기: [설정] 탭.
    </p>
  </div>`;
  for (const b of box.querySelectorAll('.regionToggle')) {
    b.onclick = async () => {
      const on = b.dataset.on === '1', region = b.dataset.region;
      const msg = on
        ? `${region} 을(를) 켭니다. 그 지역을 고른 사람이 바로 줄을 서고 "지역이 열렸어요" 알림이 갑니다.`
        : `${region} 을(를) 끕니다. 그 지역 대기열이 비워집니다(진행 중인 방은 그대로).`;
      if (!confirm(msg)) return;
      b.disabled = true;
      const { error } = await sb.rpc('admin_set_region_active', { p_region: region, p_on: on });
      if (error) { toast(error.message); b.disabled = false; return; }
      toast(on ? '켰어요' : '껐어요');
      await loadRegions();
    };
  }
}

// ---- 장소: 지역별 풀. 방마다 카페 2 · 식당 2 를 보여 주므로 지역이 열리려면 2·2 이상 ----
let placesRegion = '강남·서초';
async function loadPlaces() {
  const box = $('places');
  box.innerHTML = '<div class="card muted">불러오는 중…</div>';
  const [{ data: regions }, { data: rows, error }] = await Promise.all([
    sb.rpc('admin_region_demand'),
    sb.rpc('admin_places', { p_region: placesRegion }),
  ]);
  if (error) { box.innerHTML = `<div class="card">오류: ${error.message}</div>`; return; }
  const live = (rows ?? []).filter(r => r.active);
  const cafes = live.filter(r => r.category === '카페').length;
  const meals = live.filter(r => r.category === '식당').length;
  const options = (regions ?? []).map(r =>
    `<option ${r.region === placesRegion ? 'selected' : ''}>${escapeHtml(r.region)}</option>`).join('');
  const list = (rows ?? []).map(r => `<tr class="${r.active ? '' : 'muted'}">
      <td>${r.category}</td>
      <td><b>${escapeHtml(r.name)}</b>${r.is_partner ? ' <span class="muted">제휴</span>' : ''}<br>
          <span class="muted">${escapeHtml(r.description ?? '')}</span></td>
      <td class="muted">${escapeHtml(r.address ?? '')}<br>${escapeHtml(r.phone ?? '')}</td>
      <td><button class="ghost placeToggle" data-id="${r.id}" data-on="${r.active ? 0 : 1}"
          style="padding:6px 10px">${r.active ? '숨기기' : '다시 쓰기'}</button></td>
    </tr>`).join('');
  box.innerHTML = `
    <div class="card">
      <div class="row"><select id="placesRegion" style="flex:1;padding:10px;border-radius:12px">${options}</select></div>
      <p>쓰는 장소 <b>카페 ${cafes} · 식당 ${meals}</b>
         ${cafes >= 2 && meals >= 2 ? '— 지역을 열 수 있어요' : '— <b>2·2 가 안 되면 사람이 모여도 지역이 안 열려요</b>'}</p>
      <table><tr><th>종류</th><th>이름 · 한 줄</th><th>주소 · 전화</th><th></th></tr>
        ${list || '<tr><td colspan="4" class="muted">아직 없어요</td></tr>'}</table>
    </div>
    <div class="card">
      <h2 style="margin-top:0">장소 넣기</h2>
      <p class="muted">넣기 전에 확인: ① 지금 영업 중 ② 6명이 앉을 수 있음 ③ 전화 ④ 토 18시에 엶 ⑤ 술집 아님.
         한 줄에는 <b>역 이름</b>을 넣는다(예: "강남역 · 넓은 베이커리 카페"). 후보는 docs/PLACES_SURVEY.md.
         사진·메뉴·후기는 넣지 않는다. 제휴 배지는 여기서 켜지 않는다.</p>
      <div class="row">
        <select id="pCategory" style="padding:10px;border-radius:12px"><option>카페</option><option>식당</option></select>
        <input id="pName" placeholder="이름" style="flex:1;min-width:160px">
      </div>
      <div style="height:8px"></div>
      <input id="pDesc" placeholder="한 줄 (역 이름 포함)">
      <div style="height:8px"></div>
      <div class="row">
        <input id="pAddr" placeholder="주소" style="flex:2;min-width:200px">
        <input id="pPhone" placeholder="전화" style="flex:1;min-width:120px">
      </div>
      <div style="height:10px"></div>
      <button id="pAdd" style="width:100%">${escapeHtml(placesRegion)} 에 넣기</button>
    </div>`;
  $('placesRegion').onchange = (e) => { placesRegion = e.target.value; loadPlaces(); };
  for (const b of box.querySelectorAll('.placeToggle')) {
    b.onclick = async () => {
      b.disabled = true;
      const { error } = await sb.rpc('admin_place_set_active', { p_place: b.dataset.id, p_on: b.dataset.on === '1' });
      if (error) { toast(error.message); b.disabled = false; return; }
      await loadPlaces();
    };
  }
  $('pAdd').onclick = async () => {
    const btn = $('pAdd');
    btn.disabled = true;
    const { error } = await sb.rpc('admin_place_add', {
      p_region: placesRegion, p_category: $('pCategory').value, p_name: $('pName').value,
      p_description: $('pDesc').value, p_address: $('pAddr').value, p_phone: $('pPhone').value,
    });
    if (error) { toast(error.message); btn.disabled = false; return; }
    toast('넣었어요');
    await loadPlaces();
  };
}

// ---- 설정: 매칭 완화·지역 열기 기준. 정해 둔 키만, 범위 안에서만 (서버가 막는다) ----
async function loadConfig() {
  const box = $('config');
  box.innerHTML = '<div class="card muted">불러오는 중…</div>';
  const [{ data: cfg, error }, { data: hist }] = await Promise.all([
    sb.rpc('admin_config'), sb.rpc('admin_config_history', { p_limit: 10 }),
  ]);
  if (error) { box.innerHTML = `<div class="card">오류: ${error.message}</div>`; return; }
  const rows = (cfg ?? []).map(c => `<tr>
      <td>${escapeHtml(c.label)}<br><span class="muted">${c.key} · ${c.min}~${c.max}</span></td>
      <td style="width:90px"><input class="cfgVal" data-key="${c.key}" type="number" min="${c.min}" max="${c.max}"
          value="${c.value}" style="padding:8px"></td>
      <td><button class="ghost cfgSave" data-key="${c.key}" style="padding:6px 10px">저장</button></td>
    </tr>`).join('');
  const histRows = (hist ?? []).map(h => `<tr><td>${escapeHtml(h.key)}</td>
      <td class="num">${h.old ?? '-'} → <b>${h.new}</b></td>
      <td class="muted">${escapeHtml(h.by ?? '')} · ${new Date(h.at).toLocaleString('ko-KR')}</td></tr>`).join('');
  box.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">매칭 · 지역 설정</h2>
      <p class="muted">초기엔 널널하게, 사람이 많아지면 조인다(AGENTS 규칙 1). 바꾸면 다음 매칭 배치(1분)부터 적용.
         조이기 전에 [통계] 「대기 시간」 의 24시간 초과 비율을 본다. 지역·성비 3:3·안전 규칙은 여기 없다 — 풀지 않는다.</p>
      <table>${rows}</table>
    </div>
    <div class="card">
      <h2 style="margin-top:0">바꾼 기록</h2>
      <table>${histRows || '<tr><td class="muted">아직 없어요</td></tr>'}</table>
    </div>`;
  for (const b of box.querySelectorAll('.cfgSave')) {
    b.onclick = async () => {
      const input = box.querySelector(`.cfgVal[data-key="${b.dataset.key}"]`);
      const v = parseInt(input.value, 10);
      if (!confirm(`${b.dataset.key} 를 ${v} 로 바꿀까요?`)) return;
      b.disabled = true;
      const { error } = await sb.rpc('admin_set_config', { p_key: b.dataset.key, p_value: v });
      if (error) { toast(error.message); b.disabled = false; return; }
      toast('저장했어요');
      await loadConfig();
    };
  }
}

// ---- 통계 ----
async function loadStats() {
  const box = $('stats');
  box.innerHTML = '<div class="card muted">불러오는 중…</div>';
  const { data: s, error } = await sb.rpc('admin_stats');
  if (error) { box.innerHTML = `<div class="card">오류: ${error.message}</div>`; return; }

  const table = (rows, cols) => !rows?.length ? '<p class="muted">데이터 없음</p>' :
    `<table><tr>${cols.map(c => `<th class="${c[2] ? 'num' : ''}">${c[1]}</th>`).join('')}</tr>` +
    rows.map(r => `<tr>${cols.map(c =>
      `<td class="${c[2] ? 'num' : ''}">${r[c[0]] ?? '-'}</td>`).join('')}</tr>`).join('') + '</table>';

  const m = s.meetings ?? {}, a = s.activation ?? {}, p = s.photo ?? {};
  // 대기 시간 — "웬만하면 하루 안에 방을 연다" (2026-10-01). 실패해도 나머지 통계는 그린다.
  const { data: w } = await sb.rpc('admin_wait_stats');
  const wm = w?.matched ?? {}, ww = w?.waiting ?? {};
  box.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">대기 시간 · 하루 안에 방이 열리는가</h2>
      <p class="muted">줄에 선 뒤 방에 들어가기까지(최근 30일, 테스트 지역 제외). 준비 중 지역에서 기다린 시간은
         여기 없다 — [지역] 탭. 24시간을 넘는 비율이 오르면 완화 설정(interest_relax_after_hours ·
         age_widen_after_hours)이나 유입을 본다.</p>
      <table>
        <tr><td>방에 들어간 사람</td><td class="num"><b>${wm.count ?? 0}</b></td></tr>
        <tr><td>대기 중앙값</td><td class="num"><b>${wm.median_h ?? '-'}</b>시간</td></tr>
        <tr><td>90% 가 이 안에</td><td class="num">${wm.p90_h ?? '-'}시간</td></tr>
        <tr><td>24시간 넘게 기다린 비율</td><td class="num"><b>${wm.over_24h_pct ?? '-'}%</b></td></tr>
        <tr><td>중앙값 여 / 남</td><td class="num">${wm.female_median_h ?? '-'} / ${wm.male_median_h ?? '-'}시간</td></tr>
        <tr><td>지금 줄에 선 사람</td><td class="num">${ww.count ?? 0}</td></tr>
        <tr><td>지금 24시간 넘게 기다리는 사람</td><td class="num"><b>${ww.over_24h ?? 0}</b></td></tr>
        <tr><td>지금 가장 오래 기다린 시간</td><td class="num">${ww.oldest_h ?? '-'}시간</td></tr>
      </table>
    </div>
    <div class="card">
      <h2 style="margin-top:0">미팅 결과</h2>
      <table>
        <tr><td>미팅 열림</td><td class="num"><b>${m.total ?? 0}</b></td></tr>
        <tr><td>시간 확정</td><td class="num"><b>${m.confirmed ?? 0}</b></td></tr>
        <tr><td>판정 완료</td><td class="num"><b>${m.settled ?? 0}</b></td></tr>
        <tr><td>평균 참석 인원</td><td class="num"><b>${m.avg_attendees ?? '-'}</b></td></tr>
        <tr><td>열린 1:1</td><td class="num"><b>${m.total_dm_threads ?? 0}</b>쌍</td></tr>
        <tr><td>사전 불참 통지</td><td class="num">${m.absence_notices ?? 0}</td></tr>
      </table>
    </div>

    <div class="card">
      <h2 style="margin-top:0">북극성 · 주차별 완주율</h2>
      <p class="muted">개설 후 완주할 시간이 부족한 방은 분모에서 뺀다.</p>
      ${table(s.cohorts, [['cohort_week', '주차'], ['rooms_opened', '개설', 1],
        ['rooms_mature', '판정가능', 1], ['rooms_completed', '완주', 1], ['completion_rate_pct', '완주율%', 1]])}
    </div>

    <div class="card">
      <h2 style="margin-top:0">첫날 활성화</h2>
      <p class="muted">방 개설 알림이 먹히는가. 열지도 않았다 vs 열었는데 말 안 했다.</p>
      <table>
        <tr><td>첫날 발언율</td><td class="num"><b>${a.avg_first_day_speak_pct ?? '-'}%</b></td></tr>
        <tr><td>앱 열어본 비율</td><td class="num">${a.avg_opened_pct ?? '-'}%</td></tr>
        <tr><td>사진 등록률(3일차+)</td><td class="num">${p.avg_rate_pct ?? '-'}%</td></tr>
      </table>
    </div>

    <div class="card">
      <h2 style="margin-top:0">일차별 완료율 · 어디서 죽는가</h2>
      ${table(s.day_completion, [['day_no', '일차'], ['rooms_reached', '도달', 1],
        ['rooms_completed', '완료', 1], ['completion_rate_pct', '완료율%', 1]])}
    </div>

    <div class="card">
      <h2 style="margin-top:0">대기열 (성비가 먼저 무너진다)</h2>
      ${table(s.queue, [['region', '지역'], ['age_band', '나이대'], ['interest', '관심사'],
        ['female_waiting', '여', 1], ['male_waiting', '남', 1], ['oldest_wait_hours', '최장대기h', 1]])}
    </div>

    <div class="card">
      <h2 style="margin-top:0">이탈</h2>
      ${table(s.exits, [['cohort_week', '주차'], ['memberships', '참여', 1],
        ['still_active', '유지', 1], ['left_voluntarily', '나감', 1], ['expelled', '방출', 1]])}
    </div>`;
}

function renderContext(ctx, roomRows, r) {
  const reported = r.reported ?? '';
  const focusBody = r.message_body ?? '';
  ctx.innerHTML = `
    <input class="ctxFind" type="search" placeholder="대화에서 찾기" autocomplete="off">
    <div class="row" style="margin:8px 0">
      <button type="button" class="ghost ctxOnly" style="flex:1">이 사람이 한 말만</button>
    </div>
    <div class="ctxList"></div>`;
  const list = ctx.querySelector('.ctxList');
  const find = ctx.querySelector('.ctxFind');
  const onlyBtn = ctx.querySelector('.ctxOnly');
  let onlyThem = false;
  let userRows = null;

  function draw(rows) {
    const q = find.value.trim().toLowerCase();
    const html = [...rows].reverse().map((m) => {
      const nick = m.nickname ?? '';
      const body = m.body ?? '';
      if (q && !`${nick} ${body}`.toLowerCase().includes(q)) return '';
      const hit = focusBody && body === focusBody;
      const from = nick === reported;
      return `<p class="${hit ? 'hit' : ''} ${from ? 'fromTarget' : ''}"><b>${escapeHtml(nick)}</b>${escapeHtml(body)}</p>`;
    }).join('');
    list.innerHTML = html || '<p class="muted">해당하는 말이 없어요</p>';
    const jump = list.querySelector('.hit') || list.querySelector('.fromTarget');
    jump?.scrollIntoView({ block: 'center' });
  }

  async function paint() {
    if (!onlyThem) {
      draw(roomRows);
      return;
    }
    if (!r.reported_id) {
      toast('탈퇴한 계정이라 말을 모아 볼 수 없어요');
      onlyThem = false;
      onlyBtn.textContent = '이 사람이 한 말만';
      draw(roomRows);
      return;
    }
    if (!userRows) {
      onlyBtn.disabled = true;
      const { data, error } = await sb.rpc('admin_room_context', {
        p_room: r.room_id, p_limit: 500, p_user: r.reported_id,
      });
      onlyBtn.disabled = false;
      if (error) {
        toast('대화를 더 불러오지 못했어요');
        onlyThem = false;
        onlyBtn.textContent = '이 사람이 한 말만';
        draw(roomRows);
        return;
      }
      userRows = data ?? [];
    }
    draw(userRows);
  }

  find.oninput = () => { paint(); };
  onlyBtn.onclick = async () => {
    onlyThem = !onlyThem;
    onlyBtn.textContent = onlyThem ? '불러오는 중...' : '이 사람이 한 말만';
    await paint();
    onlyBtn.textContent = onlyThem ? '전체 대화 보기' : '이 사람이 한 말만';
  };
  paint();
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 탭. 들어갈 때만 불러온다 — 신고 처리하러 열었는데 통계 쿼리까지 도는 건 낭비다.
const TABS = { reports: loadReports, rooms: loadRooms, stats: loadStats, regions: loadRegions,
               places: loadPlaces, config: loadConfig };
let tab = 'reports';

async function showTab(name) {
  tab = name;
  for (const key of Object.keys(TABS)) {
    $(key).classList.toggle('hidden', key !== name);
    $('tab' + key[0].toUpperCase() + key.slice(1)).classList.toggle('on', key === name);
  }
  await TABS[name]();
}
$('tabReports').onclick = () => showTab('reports');
$('tabRooms').onclick = () => showTab('rooms');
$('tabStats').onclick = () => showTab('stats');
$('tabRegions').onclick = () => showTab('regions');
$('tabPlaces').onclick = () => showTab('places');
$('tabConfig').onclick = () => showTab('config');

$('loginBtn').onclick = login;
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('refresh').onclick = async () => {
  const { data } = await sb.rpc('admin_dashboard');
  if (data) render(data);
  await TABS[tab]();   // 보고 있는 탭만 다시 부른다
};
$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// 이미 로그인돼 있으면 바로 콘솔로
const { data: { session } } = await sb.auth.getSession();
if (session) await start();
</script>
